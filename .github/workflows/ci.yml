name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiler tools and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison make
          python -m pip install -r requirements.txt
      - name: Build lexer and parser
        run: make
      - name: Run all tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  lexer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flex and compiler tools
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison make
      - name: Build lexer and parser
        run: make
      - name: Run complete test suite
        run: make test
